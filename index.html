<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lecture Notes</title>
<style>
  :root {
    --bg: #faf9f6;
    --panel: #fffefb;
    --ink: #1b1a16;
    --muted: #5f5c52;
    --faint: #6f6b5d;
    --line: #e4e0d5;
    --line-strong: #d2cdbe;
    --accent: #b23227;
    --accent-ink: #fff;
    --focus: #2f6f6a;
    --radius: 10px;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --serif: ui-serif, "Iowan Old Style", "Source Serif 4", Charter, Georgia, serif;
    color-scheme: light dark;
    accent-color: var(--focus);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #131311;
      --panel: #1a1a17;
      --ink: #eeebe2;
      --muted: #b3aea1;
      --faint: #9a9588;
      --line: #2a2a26;
      --line-strong: #3a3934;
      --accent: #ff6b57;
      --accent-ink: #1a0f0d;
      --focus: #6fd0c6;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.6 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding-block: 32px 96px; padding-inline: 20px; }

  ::selection { background: color-mix(in srgb, var(--focus) 28%, transparent); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
  input, select, textarea { caret-color: var(--focus); }
  .scroll { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
  .scroll::-webkit-scrollbar { width: 10px; height: 10px; }
  .scroll::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 99px; border: 3px solid var(--panel); }
  .scroll::-webkit-scrollbar-track { background: transparent; }

  /* masthead */
  .masthead { display: flex; align-items: baseline; gap: 12px; margin-bottom: 24px; }
  h1 { font: 600 19px/1.2 var(--sans); letter-spacing: -0.01em; margin: 0; }
  .live {
    display: none; align-items: center; gap: 7px;
    font-size: 13px; color: var(--accent); font-variant-numeric: tabular-nums;
  }
  body.recording .live { display: inline-flex; }
  .live .dot { width: 8px; height: 8px; border-radius: 99px; background: var(--accent); animation: pulse 2s cubic-bezier(.22,1,.36,1) infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.82); } }
  @media (prefers-reduced-motion: reduce) { .live .dot { animation: none; } }

  /* controls */
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .bar .spacer { flex: 1; }
  button {
    font: 500 14px/1 var(--sans);
    padding: 10px 15px; border-radius: var(--radius);
    border: 1px solid var(--line-strong); background: var(--panel); color: var(--ink);
    cursor: pointer; transition: background .12s ease, border-color .12s ease, transform .06s ease;
  }
  button:hover:not(:disabled) { border-color: var(--faint); background: color-mix(in srgb, var(--ink) 4%, var(--panel)); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .42; cursor: default; }
  #rec { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  #rec:hover { background: color-mix(in srgb, #000 10%, var(--accent)); border-color: color-mix(in srgb, #000 10%, var(--accent)); }
  #clear { color: var(--muted); border-color: transparent; background: transparent; }
  #clear:hover:not(:disabled) { color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); border-color: transparent; }

  /* sections */
  h2 {
    font: 600 11px/1 var(--sans); text-transform: uppercase; letter-spacing: .09em;
    color: var(--faint); margin: 40px 0 10px; display: flex; align-items: baseline; gap: 8px;
  }
  h2 .note { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--faint); }

  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  input, select {
    font: 14px/1.4 var(--sans); color: var(--ink);
    padding: 9px 11px; border-radius: var(--radius);
    border: 1px solid var(--line-strong); background: var(--panel);
    transition: border-color .12s ease;
  }
  select { flex: 0 1 230px; min-width: 0; }
  input { flex: 1 1 200px; min-width: 0; }
  input:hover:not(:disabled), select:hover { border-color: var(--faint); }
  input:disabled { opacity: .45; }
  input::placeholder { color: var(--faint); }
  #hint { font-size: 13px; color: var(--muted); margin: 8px 0 0; }

  #transcript {
    white-space: pre-wrap; max-height: 210px; overflow: auto;
    padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--panel); color: var(--muted); font-size: 14px; line-height: 1.7;
  }
  #transcript:empty::before { content: attr(data-empty); color: var(--faint); font-style: italic; }

  /* notes read as a document, not as chrome */
  #notes { font-family: var(--serif); font-size: 17.5px; line-height: 1.7; max-width: 68ch; }
  #notes:empty::before { content: attr(data-empty); font-family: var(--sans); font-size: 14px; color: var(--faint); font-style: italic; }
  #notes h2 {
    font: 600 20px/1.3 var(--serif); text-transform: none; letter-spacing: -0.01em;
    color: var(--ink); margin: 30px 0 8px; padding-bottom: 7px; border-bottom: 1px solid var(--line);
  }
  #notes h2:first-child { margin-top: 4px; }
  #notes h3 { font: 600 16px/1.4 var(--serif); margin: 20px 0 4px; }
  #notes p { margin: 0 0 12px; }
  #notes ul { margin: 0 0 14px; padding-left: 1.1em; }
  #notes li { margin: 5px 0; padding-left: 2px; }
  #notes li::marker { color: var(--faint); }
  #notes strong { font-weight: 640; }
  #notes code { font-size: .88em; background: color-mix(in srgb, var(--ink) 7%, transparent); padding: 1px 5px; border-radius: 4px; }
  .err { color: var(--accent); font-family: var(--sans); font-size: 14px; }
  .working { color: var(--muted); font-family: var(--sans); font-size: 14px; }

  @media (max-width: 520px) {
    .wrap { padding-block: 24px 64px; }
    .bar button { flex: 1 1 auto; min-width: 0; }
    #rec { flex: 1 0 100%; }
    #clear { flex: 0 0 auto; }
    select, input { flex: 1 1 100%; }
    #notes { font-size: 16.5px; }
  }
</style>

<div class="wrap">
  <div class="masthead">
    <h1>Lecture Notes</h1>
    <span class="live"><span class="dot"></span><span id="elapsed">0:00</span></span>
  </div>

  <div class="bar">
    <button id="rec">Record</button>
    <button id="gen" disabled>Generate notes</button>
    <button id="copy" disabled>Copy</button>
    <span class="spacer"></span>
    <button id="clear">Clear</button>
  </div>

  <h2>Model <span class="note">key stays in this browser</span></h2>
  <div class="row">
    <select id="provider"></select>
    <input id="key" type="password" placeholder="API key">
  </div>
  <p id="hint"></p>

  <h2>Transcript <span class="note" id="status"></span></h2>
  <div id="transcript" class="scroll" data-empty="Press Record and the lecture appears here as it is spoken."></div>

  <h2>Notes</h2>
  <div id="notes" data-empty="Record a lecture, then press Generate notes."></div>
</div>

<script>
const $ = id => document.getElementById(id);

// All OpenAI-compatible /chat/completions endpoints.
const PROVIDERS = {
  groq:       { name: 'Groq (free key)',        url: 'https://api.groq.com/openai/v1/chat/completions', model: 'llama-3.3-70b-versatile', hint: 'Free key: console.groq.com/keys' },
  gemini:     { name: 'Google Gemini (free key)', url: 'https://generativelanguage.googleapis.com/v1beta/openai/chat/completions', model: 'gemini-2.0-flash', hint: 'Free key: aistudio.google.com/apikey' },
  openrouter: { name: 'OpenRouter (free models)', url: 'https://openrouter.ai/api/v1/chat/completions', model: 'meta-llama/llama-3.3-70b-instruct:free', hint: 'Free key: openrouter.ai/keys — model is a :free one' },
  ollama:     { name: 'Ollama (local, no key)',  url: 'http://localhost:11434/v1/chat/completions', model: 'llama3.1', hint: 'Fully local. Run: OLLAMA_ORIGINS=* ollama serve — only works when this page is on http://localhost' },
};
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let final = localStorage.getItem('transcript') || '', want = false, rec;

$('provider').innerHTML = Object.entries(PROVIDERS).map(([k, p]) => `<option value="${k}">${p.name}</option>`).join('');
$('provider').value = localStorage.getItem('provider') || 'groq';
$('provider').onchange = () => { localStorage.setItem('provider', $('provider').value); loadProvider(); };
$('key').oninput = () => localStorage.setItem('key_' + $('provider').value, $('key').value.trim());
function loadProvider() {
  const p = PROVIDERS[$('provider').value];
  $('key').value = localStorage.getItem('key_' + $('provider').value) || '';
  $('key').disabled = $('provider').value === 'ollama';
  $('hint').textContent = p.hint + ' · model: ' + p.model;
}
loadProvider();

if (!SR) $('status').innerHTML = '<span class="err">— speech recognition needs Chrome/Edge/Safari</span>';

function render(interim) {
  localStorage.setItem('transcript', final);
  $('transcript').textContent = final + interim;
  $('transcript').scrollTop = 1e9;
  $('gen').disabled = !final.trim();
}

let sessionStart = 0, quickEnds = 0;
function start() {
  rec = new SR();
  sessionStart = Date.now();
  rec.continuous = true; rec.interimResults = true; rec.lang = navigator.language || 'en-US';
  rec.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) final += t.trim() + ' '; else interim += t;
    }
    render(interim);
  };
  // browsers cut the stream every ~60s; just restart while recording.
  // But a session that dies instantly means something is actually wrong
  // (offline, mic gone) — don't hot-loop forever showing "listening".
  rec.onend = () => {
    if (!want) return;
    if (Date.now() - sessionStart >= 1000) quickEnds = 0;
    else if (++quickEnds > 5) {
      want = false; toggleUI();
      $('status').innerHTML = '<span class="err">— recognition keeps dropping; check mic and connection</span>';
      return;
    }
    start();
  };
  rec.onerror = e => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { want = false; toggleUI(); $('status').innerHTML = '<span class="err">— mic permission denied</span>'; } };
  rec.start();
}

let startedAt = 0, tick;
function toggleUI() {
  document.body.classList.toggle('recording', want);
  $('rec').textContent = want ? 'Stop' : 'Record';
  $('status').textContent = want ? 'listening' : '';
  clearInterval(tick);
  if (want) {
    startedAt = Date.now();
    const show = () => {
      const s = Math.floor((Date.now() - startedAt) / 1000);
      $('elapsed').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    };
    show();
    tick = setInterval(show, 1000);
  }
}

$('rec').onclick = () => {
  if (!SR) return;
  want = !want;
  if (want) start(); else rec && rec.stop();
  toggleUI();
};

const PROMPT = `You are taking notes for a student during a lecture. Below is a raw, unpunctuated speech-to-text transcript that may contain recognition errors — infer the intended words.

Write clear lecture notes in markdown:
- A "## Summary" of 2-3 sentences
- "## Key points" as nested bullets organized by topic
- "## Terms & definitions" for any jargon defined
- "## Action items" for anything assigned, due, or flagged as exam material (omit the section if none)

Only use what is in the transcript. Do not invent facts.

Transcript:
`;

$('gen').onclick = async () => {
  const p = PROVIDERS[$('provider').value], key = $('key').value.trim();
  if (!key && $('provider').value !== 'ollama') { $('notes').innerHTML = '<p class="err">Add an API key above to generate notes.</p>'; $('key').focus(); return; }
  $('gen').disabled = true; $('notes').innerHTML = '<p class="working">Writing notes…</p>';
  try {
    const r = await fetch(p.url, {
      method: 'POST',
      headers: { 'content-type': 'application/json', ...(key && { authorization: 'Bearer ' + key }) },
      body: JSON.stringify({ model: p.model, max_tokens: 4000, messages: [{ role: 'user', content: PROMPT + final }] }),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error?.message || r.statusText);
    showNotes(j.choices[0].message.content);
  } catch (e) {
    $('notes').innerHTML = '<p class="err">' + e.message + '</p>';
  }
  $('gen').disabled = false;
};

function showNotes(text) {
  localStorage.setItem('notes', text);
  $('notes').innerHTML = md(text);
  $('copy').disabled = false;
  $('copy').onclick = () => navigator.clipboard.writeText(text);
}

$('clear').onclick = () => {
  if (!confirm('Delete this transcript and its notes?')) return;
  final = ''; localStorage.removeItem('transcript'); localStorage.removeItem('notes');
  $('notes').textContent = ''; $('copy').disabled = true;
  render('');
};

if (localStorage.getItem('notes')) showNotes(localStorage.getItem('notes'));
render('');

// minimal markdown: headings, bullets, bold, code
function md(s) {
  const esc = t => t.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  return esc(s)
    .replace(/^### (.*)$/gm, '<h3>$1</h3>')
    .replace(/^#{1,2} (.*)$/gm, '<h2>$1</h2>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`(.+?)`/g, '<code>$1</code>')
    .replace(/^(\s*)[-*] (.*)$/gm, (_, sp, t) => `<li style="margin-left:${sp.length * 12}px">${t}</li>`)
    .replace(/(<li[\s\S]*?<\/li>\n?)+/g, m => '<ul>' + m + '</ul>')
    .replace(/^(?!<[hul])(.+)$/gm, '<p>$1</p>');
}
</script>
